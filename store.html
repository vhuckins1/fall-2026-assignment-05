<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holo Haven Cards | Store</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar">
        <a href="./index.html" class="logo">Holo<span>Haven</span></a>
        <ul class="nav-links">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./store.html" class="active">Store</a></li>
        </ul>
      </nav>

    <main>
      <section class="page-banner">
        <h1>Shop the Collection</h1>
      </section>

      <section class="section">
        <!-- main.js fills this grid with product cards -->
        <div id="product-grid" class="product-grid"></div>

        <!-- Pagination controls (main.js wires these up) -->
        <div class="pagination">
          <button id="prev-btn" class="btn">&larr; Previous</button>
          <span id="page-indicator">Page 1 of 3</span>
          <button id="next-btn" class="btn">Next &rarr;</button>
        </div>

    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>Open Tue–Sat, 11am–7pm</p>
      </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
